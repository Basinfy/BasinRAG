name: BasinRAG CI

# Manual trigger only — avoids burning GitHub Actions minutes on every push/PR
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Versão do Python para teste'
        required: false
        default: '3.11'
        type: choice
        options:
          - '3.11'
          - '3.10'
          - '3.12'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version || '3.11' }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff Lint
      run: ruff check .

    - name: Tests + Coverage
      run: pytest --cov=basinrag --cov-report=term-missing tests/
