[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["basinrag*"]

[project]
name = "basinrag"
dynamic = ["version"]
description = "Hybrid BM25 and dense retrieval with immutable document-basin snapshots"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alex Martins" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
urls = { Homepage = "https://github.com/Basinfy/BasinRAG", Repository = "https://github.com/Basinfy/BasinRAG", Issues = "https://github.com/Basinfy/BasinRAG/issues" }
dependencies = [
    "langchain-core>=0.1.33",
    "sentence-transformers>=2.5.1",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.1.0",
    "charset-normalizer>=3.3",
    "huggingface-hub>=0.25",
    "langchain-text-splitters>=0.2.0",
    "filelock>=3.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
nlp = ["snowballstemmer>=3.1.1,<4"]
ollama = ["langchain-ollama>=0.1.0"]
openai = ["langchain-openai>=0.1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "slowapi>=0.1.9", "pydantic>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "mypy>=1.9", "ruff>=0.3", "build>=1.2", "pip-audit>=2.7"]
eval = ["mteb>=1.0", "datasets>=2.0", "beir>=2.0"]

[project.scripts]
basinrag = "basinrag.cli:main"

[tool.setuptools.dynamic]
version = { attr = "basinrag._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["basinrag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "build",
    "dist",
    ".venv",
    "paper",
    "results",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (used for lazy loading and PyTorch shims)
    "E741",  # ambiguous variable name (standard FAISS D, I notation)
    "E701",  # multiple statements on one line (inline benchmark stats)
    "F841",  # local variable assigned but never used
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]


